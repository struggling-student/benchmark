[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapienza-llm-bench"
  version = "0.0.1"
description = "Thin, reproducible LLM inference benchmarks for a GPU baseline and future CPU-HBM studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
dashboard = [
  "pandas>=2.0",
  "plotly>=5.0",
  "streamlit>=1.59",
]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
