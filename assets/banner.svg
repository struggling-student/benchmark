<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="LLM Inference Benchmark banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a3a"/>
      <stop offset="100%" stop-color="#1c1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#6d5df6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d5df6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#38e0c8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.06">
    <rect x="1004" y="56" width="6" height="6" rx="1"/>
    <rect x="1118" y="44" width="6" height="6" rx="1"/>
    <rect x="940" y="28" width="6" height="6" rx="1"/>
    <rect x="1084" y="120" width="6" height="6" rx="1"/>
    <rect x="1150" y="88" width="6" height="6" rx="1"/>
  </g>

  <g transform="translate(56,56)">
    <rect width="272" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="136" y="20" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#b9c2ff">SAPIENZA HPC · LLM BENCH</text>
  </g>

  <text x="60" y="168" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="800" fill="#f5f7ff" letter-spacing="-0.5">
    LLM Inference Benchmark
  </text>
  <text x="60" y="212" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" fill="#a7b0d6">
    Composable vLLM &amp; llama.cpp benchmarks for GPU and CPU studies
  </text>

  <text x="60" y="248" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#7b86b5">
    Llama-3.1-8B-Instruct · Llama-3.2-1B-Instruct · smoke / offline / serving
  </text>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600">
    <rect x="56" y="266" width="102" height="32" rx="8" fill="#5b8cff" fill-opacity="0.16" stroke="#5b8cff" stroke-opacity="0.55"/>
    <text x="107" y="287" text-anchor="middle" fill="#bcd3ff">vLLM</text>

    <rect x="170" y="266" width="122" height="32" rx="8" fill="#ff9f43" fill-opacity="0.15" stroke="#ff9f43" stroke-opacity="0.55"/>
    <text x="231" y="287" text-anchor="middle" fill="#ffd9a8">llama.cpp</text>

    <rect x="304" y="266" width="100" height="32" rx="8" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="354" y="287" text-anchor="middle" fill="#a7f3d0">Slurm</text>

    <rect x="416" y="266" width="106" height="32" rx="8" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="469" y="287" text-anchor="middle" fill="#a5f3fc">Docker</text>

    <rect x="534" y="266" width="130" height="32" rx="8" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-opacity="0.5"/>
    <text x="599" y="287" text-anchor="middle" fill="#e9d5ff">Apptainer</text>
  </g>

  <g transform="translate(790,64)">
    <rect width="350" height="208" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="22" y="30" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#8f9ac7">MEASURE · COMPARE</text>

    <g>
      <line x1="22" y1="168" x2="328" y2="168" stroke="#ffffff" stroke-opacity="0.1"/>
      <line x1="22" y1="126" x2="328" y2="126" stroke="#ffffff" stroke-opacity="0.05"/>
      <line x1="22" y1="84" x2="328" y2="84" stroke="#ffffff" stroke-opacity="0.05"/>
    </g>

    <rect x="40"  y="148" width="36" height="20" rx="4" fill="url(#bars)" fill-opacity="0.9"/>
    <rect x="90"  y="96"  width="36" height="72" rx="4" fill="url(#bars)" fill-opacity="0.9"/>
    <rect x="140" y="132" width="36" height="36" rx="4" fill="url(#bars)" fill-opacity="0.9"/>
    <rect x="190" y="66"  width="36" height="102" rx="4" fill="url(#bars)" fill-opacity="0.9"/>
    <rect x="240" y="118" width="36" height="50" rx="4" fill="url(#bars)" fill-opacity="0.9"/>
    <rect x="290" y="84"  width="36" height="84" rx="4" fill="url(#bars)" fill-opacity="0.9"/>

    <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#a7b0d6" text-anchor="middle">
      <text x="58" y="190">TTFT</text>
      <text x="108" y="190">TPUT</text>
      <text x="158" y="190">E2E</text>
      <text x="208" y="190">GPU</text>
      <text x="258" y="190">PWR</text>
      <text x="308" y="190">MEM</text>
    </g>

    <rect x="22" y="196" width="306" height="2" rx="1" fill="url(#bars)" fill-opacity="0.5"/>
  </g>
</svg>